<title>SEO Job Applications</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: one column of job rows grouped by the day they were found, a sticky filter bar on top. */
:root {
  --bg: #f6f7f5; --surface: #ffffff; --fg: #1c2420; --muted: #5d6a63; --line: #dfe4e0;
  --accent: #1f7a5a; --accent-soft: #e2f1ea; --maybe: #9a6a12; --maybe-soft: #f7eed9; --done: #8a948f;
  --font-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #121614; --surface: #1a201d; --fg: #e4ebe7; --muted: #95a39b; --line: #2b3430;
  --accent: #5cc79c; --accent-soft: #1d3a2e; --maybe: #e0b45a; --maybe-soft: #3a3020; --done: #6c7771; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #121614; --surface: #1a201d; --fg: #e4ebe7; --muted: #95a39b; --line: #2b3430;
  --accent: #5cc79c; --accent-soft: #1d3a2e; --maybe: #e0b45a; --maybe-soft: #3a3020; --done: #6c7771; color-scheme: dark }
* { box-sizing: border-box }
body { background: var(--bg); color: var(--fg); font: 15px/1.5 var(--font-body); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg) }
.wrap { max-width: 860px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 24px 64px }
header h1 { font-size: 1.5rem; font-weight: 600; margin: 0 0 4px; text-wrap: balance }
header p { margin: 0; color: var(--muted); max-width: 65ch }
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); padding-block: 14px 10px; border-bottom: 1px solid var(--line); display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 16px }
.tab { font: 500 0.85rem var(--font-body); border: 1px solid var(--line); background: var(--surface); color: var(--fg); border-radius: 999px; padding: 6px 12px; cursor: pointer }
.tab[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--bg) }
.tab .n { font-family: var(--font-mono); font-variant-numeric: tabular-nums; margin-left: 4px; opacity: .8 }
.tab:focus-visible, .row input:focus-visible, .hide:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px }
#search { flex: 1 1 180px; min-width: 0; font: inherit; padding: 6px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); color: var(--fg) }
.status { color: var(--muted); font-size: .85rem; padding-top: 10px }
.day { margin-top: 22px }
.day h2 { font: 500 .78rem var(--font-mono); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin: 0 0 8px }
.list { display: grid; gap: 8px }
.row { display: grid; grid-template-columns: 28px minmax(0, 1fr) auto; gap: 10px; align-items: start; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px }
.row input[type=checkbox] { width: 20px; height: 20px; margin: 2px 0 0; accent-color: var(--accent); cursor: pointer }
.row.applied .title { text-decoration: line-through; color: var(--done) }
.title { font-weight: 600; margin: 0 }
.title .co { font-weight: 400; color: var(--muted) }
.meta { display: flex; flex-wrap: wrap; gap: 6px; margin: 6px 0 0; font-size: .85rem; color: var(--muted) }
.chip { font: 500 .72rem var(--font-mono); padding: 2px 7px; border-radius: 6px; background: var(--accent-soft); color: var(--accent) }
.chip.maybe { background: var(--maybe-soft); color: var(--maybe) }
.chip.src { background: transparent; border: 1px solid var(--line); color: var(--muted) }
.terms, .how, .note { margin: 6px 0 0; font-size: .9rem; overflow-wrap: anywhere }
.note { color: var(--muted) }
.links { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 8px; font-size: .9rem }
.links a { color: var(--accent); font-weight: 500 }
.hide { font: .8rem var(--font-body); background: none; border: none; color: var(--muted); cursor: pointer; padding: 2px 4px; text-decoration: underline; white-space: nowrap }
.side { display: flex; flex-direction: column; align-items: flex-end; gap: 4px }
.fb { font: 500 .75rem var(--font-body); border: 1px solid var(--line); background: var(--surface); color: var(--fg); border-radius: 6px; padding: 3px 8px; cursor: pointer; white-space: nowrap }
.fb:hover { border-color: var(--maybe); color: var(--maybe) }
.fb:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px }
.chip.why { background: var(--maybe-soft); color: var(--maybe) }
.when { font: .75rem var(--font-mono); color: var(--done); margin-top: 6px }
.empty { margin-top: 32px; padding: 24px; border: 1px dashed var(--line); border-radius: 10px; color: var(--muted); text-align: center }
@media (prefers-reduced-motion: no-preference) { .row { transition: opacity .2s } }
</style>

<div class="wrap">
  <header>
    <h1>SEO Job Applications</h1>
    <p>Roles the daily scout found for you, newest first. Tick a role once you've applied. If you won't apply, mark why: the scout reads those marks and shows you fewer roles like it.</p>
  </header>
  <div class="bar" role="toolbar" aria-label="Filter">
    <button class="tab" id="tab-todo" data-f="todo" aria-pressed="true">To apply<span class="n" id="n-todo">0</span></button>
    <button class="tab" id="tab-maybe" data-f="maybe" aria-pressed="false">Maybe<span class="n" id="n-maybe">0</span></button>
    <button class="tab" id="tab-applied" data-f="applied" aria-pressed="false">Applied<span class="n" id="n-applied">0</span></button>
    <button class="tab" id="tab-hidden" data-f="hidden" aria-pressed="false">Didn't apply<span class="n" id="n-hidden">0</span></button>
    <input id="search" type="search" placeholder="Search role or company" aria-label="Search role or company">
  </div>
  <div class="status" id="status">Loading your list…</div>
  <main id="out"></main>
</div>

<script>
(function () {
  const out = document.getElementById("out"), status = document.getElementById("status");
  let rows = [], filter = "todo", q = "", db = null, busy = new Set();
  const REASONS = { us_only: "US only", salary_low: "Salary too low", not_available: "Not available", not_for_me: "Not for me" };
  const LEGACY = { field_not_interesting: "Not for me", blacklisted: "Blacklisted", us_rule: "US only (scout's rule)" };
  const SRC = { linkedin_jobs: "LinkedIn Jobs", linkedin_posts: "LinkedIn post", pick: "your pick", board: "startup board", other: "other" };
  try { const f = localStorage.getItem("jobs.filter"); if (f) filter = f; } catch (e) {}

  function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
  function safe(u) { return typeof u === "string" && u.startsWith("https://") ? u : null; }
  function bucket(r) { return r.applied ? "applied" : r.hidden ? "hidden" : r.lean === "maybe" ? "maybe" : "todo"; }

  function render() {
    const counts = { todo: 0, maybe: 0, applied: 0, hidden: 0 };
    rows.forEach(r => counts[bucket(r)]++);
    for (const k in counts) document.getElementById("n-" + k).textContent = counts[k];
    document.querySelectorAll(".tab").forEach(t => t.setAttribute("aria-pressed", String(t.dataset.f === filter)));
    const ql = q.toLowerCase();
    const shown = rows.filter(r => bucket(r) === filter && (!ql || ((r.role || "") + " " + (r.company || "")).toLowerCase().includes(ql)));
    out.replaceChildren();
    if (!shown.length) {
      out.append(el("div", "empty", rows.length ? "Nothing here." : "No roles yet. The daily scout adds the roles worth applying to each morning, around 9:30 US Eastern."));
      return;
    }
    const days = {};
    shown.forEach(r => (days[r.added || "undated"] = days[r.added || "undated"] || []).push(r));
    Object.keys(days).sort().reverse().forEach(day => {
      const sec = el("section", "day"); sec.append(el("h2", null, day === "undated" ? "Undated" : "Found " + day));
      const list = el("div", "list");
      days[day].forEach(r => list.append(rowEl(r)));
      sec.append(list); out.append(sec);
    });
  }

  function rowEl(r) {
    const row = el("article", "row" + (r.applied ? " applied" : ""));
    const cb = document.createElement("input"); cb.type = "checkbox"; cb.id = "cb-" + r.id; cb.checked = !!r.applied;
    cb.setAttribute("aria-label", "Applied: " + (r.role || "") + " at " + (r.company || ""));
    cb.disabled = !db || busy.has(r.id);
    cb.addEventListener("change", () => save(r, { applied: cb.checked, applied_at: cb.checked ? new Date().toISOString().slice(0, 10) : null }));
    const body = el("div"); body.style.minWidth = "0";
    const t = el("p", "title", r.role || "Role"); if (r.company) { t.append(" "); t.append(el("span", "co", "at " + r.company)); }
    body.append(t);
    const meta = el("div", "meta");
    meta.append(el("span", "chip" + (r.lean === "maybe" ? " maybe" : ""), r.lean === "maybe" ? "maybe" : "apply"));
    if (r.source) meta.append(el("span", "chip src", SRC[r.source] || r.source));
    if (r.hidden && r.skip_reason) meta.append(el("span", "chip why", "Didn't apply: " + (REASONS[r.skip_reason] || LEGACY[r.skip_reason] || r.skip_reason)));
    if (r.location) meta.append(el("span", null, r.location));
    body.append(meta);
    if (r.terms) body.append(el("p", "terms", r.terms));
    if (r.how) body.append(el("p", "how", "How to apply: " + r.how));
    if (r.note) body.append(el("p", "note", r.note));
    const links = el("div", "links");
    [["Apply", r.link], ["Post", r.post]].forEach(([label, u]) => {
      const s = safe(u); if (!s) return;
      const a = el("a", null, label + " ↗"); a.href = s; a.target = "_blank"; a.rel = "noopener"; links.append(a);
    });
    if (links.children.length) body.append(links);
    if (r.applied && r.applied_at) body.append(el("div", "when", "Applied " + r.applied_at));
    const side = el("div", "side");
    if (!r.applied && !r.hidden) {
      Object.entries(REASONS).forEach(([code, label]) => {
        const b = el("button", "fb", label); b.type = "button"; b.disabled = !db || busy.has(r.id);
        b.title = "Mark as not applied: " + label;
        b.addEventListener("click", () => save(r, { hidden: true, skip_reason: code, skipped_at: new Date().toISOString().slice(0, 10) }));
        side.append(b);
      });
    } else if (r.hidden) {
      const h = el("button", "hide", "Restore"); h.type = "button"; h.disabled = !db || busy.has(r.id);
      h.addEventListener("click", () => save(r, { hidden: false, skip_reason: null, skipped_at: null }));
      side.append(h);
    }
    row.append(cb, body, side);
    return row;
  }

  async function save(r, patch) {
    if (!db || busy.has(r.id)) return;
    busy.add(r.id); render();
    try { await db.collection("jobs").doc(r.id).update(patch); status.textContent = ""; }
    catch (e) { status.textContent = "Couldn't save that change (" + (e && e.code || "error") + "). Try again in a moment."; }
    finally { busy.delete(r.id); render(); }
  }

  document.querySelectorAll(".tab").forEach(t => t.addEventListener("click", () => {
    filter = t.dataset.f; try { localStorage.setItem("jobs.filter", filter); } catch (e) {} render();
  }));
  document.getElementById("search").addEventListener("input", e => { q = e.target.value; render(); });
  render();

  (async () => {
    db = await (window.claude && window.claude.use ? window.claude.use("db") : null);
    if (!db) { status.textContent = "Sign in to claude.ai to see and tick your list."; render(); return; }
    const timer = setTimeout(() => { status.textContent = "Your list can't be reached yet. It will appear when the connection comes back."; }, 10000);
    db.collection("jobs").onSnapshot(snap => {
      if (!snap.metadata.fromCache) { clearTimeout(timer); status.textContent = ""; }
      rows = snap.docs.map(d => Object.assign({ id: d.id }, d.data()));
      rows.sort((a, b) => (b.added || "").localeCompare(a.added || "") || (a.lean === "maybe") - (b.lean === "maybe"));
      render();
    }, e => { clearTimeout(timer); status.textContent = "Your list stopped updating (" + (e && e.code || "error") + "). Reload the page to reconnect."; });
  })();
})();
</script>
